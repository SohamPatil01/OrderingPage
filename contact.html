<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 500px;
        box-sizing: border-box;
      }

      h1 {
        text-align: center;
        color: #d62828;
        margin-bottom: 30px;
      }

      label {
        display: block;
        margin: 10px 0 5px;
        font-weight: 500;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        background: #f9f9f9;
        transition: 0.3s;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #d62828;
        background: #fff;
      }

      textarea {
        resize: vertical;
      }

      button {
        background-color: #d62828;
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 20px;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #a71d1d;
      }

      .success,
      .error {
        margin-top: 15px;
        text-align: center;
        font-weight: 500;
      }

      .success {
        color: green;
      }

      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Contact Us</h1>
      <form id="contactForm">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g., John Doe" required />

        <label for="email">Your Email</label>
        <input
          type="email"
          id="email"
          placeholder="e.g., john@example.com"
          required
        />

        <label for="message">Your Message</label>
        <textarea
          id="message"
          rows="5"
          placeholder="Type your message..."
          required
        ></textarea>

        <button type="submit">Send Message</button>
        <div id="responseMsg" class=""></div>
      </form>
    </div>

    <script>
      const form = document.getElementById("contactForm");
      const responseMsg = document.getElementById("responseMsg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;

        responseMsg.textContent = "Sending...";
        responseMsg.className = "";

        try {
          const res = await fetch("http://localhost:3000/send-email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, message }),
          });

          const result = await res.text();
          responseMsg.textContent = result;
          responseMsg.className = res.ok ? "success" : "error";
          if (res.ok) form.reset();
        } catch (err) {
          responseMsg.textContent = "Something went wrong!";
          responseMsg.className = "error";
        }
      });
    </script>
  </body>
</html>
