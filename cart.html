<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart - Indian Spice</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fffaf5;
        margin: 0;
        padding: 0;
      }

      header {
        background-color: #d62828;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 1.8rem;
      }

      nav {
        background-color: #f77f00;
        text-align: center;
        padding: 10px;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 0 15px;
        font-weight: bold;
      }

      nav a:hover {
        text-decoration: underline;
        color: #003049;
      }

      .cart-container {
        max-width: 900px;
        margin: 40px auto;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }

      h2 {
        color: #d62828;
        margin-bottom: 25px;
        text-align: center;
      }

      .cart-items {
        list-style: none;
        padding: 0;
      }

      .cart-items li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 10px;
        border-bottom: 1px solid #eee;
        font-size: 1.1rem;
      }

      .item-name {
        flex: 2;
      }
      .item-qty {
        flex: 1;
        text-align: center;
      }
      .item-price {
        flex: 1;
        text-align: right;
      }

      .remove-btn {
        background-color: #ff4d4d;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
        margin-left: 10px;
      }

      .remove-btn:hover {
        background-color: #c82333;
      }

      .total {
        text-align: right;
        font-size: 1.2rem;
        font-weight: bold;
        margin-top: 20px;
        color: #003049;
      }

      .place-order-btn {
        display: block;
        margin: 30px auto 0;
        padding: 12px 30px;
        background-color: #f77f00;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .place-order-btn:hover {
        background-color: #d62828;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Your Cart</h1>
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="cart-container">
      <h2>Items in Your Cart</h2>
      <ul class="cart-items" id="cart-items">
        <!-- Cart items go here -->
      </ul>
      <div class="total" id="total">Total: ₹0</div>
      <button class="place-order-btn" onclick="placeOrder()">
        Place Order
      </button>
    </div>

    <script>
      function renderCart() {
        const cartItems = JSON.parse(localStorage.getItem("cart")) || [];
        const cartList = document.getElementById("cart-items");
        const totalEl = document.getElementById("total");
        cartList.innerHTML = "";

        const grouped = {};
        cartItems.forEach((item) => {
          if (!grouped[item.name]) {
            grouped[item.name] = { ...item, qty: 1 };
          } else {
            grouped[item.name].qty++;
            grouped[item.name].price += item.price;
          }
        });

        let total = 0;
        Object.values(grouped).forEach((item, index) => {
          const li = document.createElement("li");
          li.innerHTML = `
            <span class="item-name">${item.name}</span>
            <span class="item-qty">Qty: ${item.qty}</span>
            <span class="item-price">₹${item.price}</span>
            <button class="remove-btn" onclick="removeItem('${item.name}')">Remove</button>
          `;
          cartList.appendChild(li);
          total += item.price;
        });

        totalEl.innerText = `Total: ₹${total}`;
      }

      function removeItem(name) {
        let cartItems = JSON.parse(localStorage.getItem("cart")) || [];
        const index = cartItems.findIndex((item) => item.name === name);
        if (index > -1) {
          cartItems.splice(index, 1);
        }
        localStorage.setItem("cart", JSON.stringify(cartItems));
        renderCart();
      }

      function placeOrder() {
        alert("Your order has been placed!");
        localStorage.removeItem("cart");
        renderCart();
      }

      renderCart();
    </script>
  </body>
</html>
